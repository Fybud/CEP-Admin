name: cep-admin

services:
  admin-api:
    image: fybud/cep-admin-api:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      GOOGLE_CLIENT_ID:
      JWT_SECRET:
      SUPER_ADMIN_EMAIL:
      ADMIN_DATABASE_URL:
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4200"
    labels:
      fybud.expose: "true"
      fybud.domain: api.admin.cep.fybud.com
      fybud.role: api
      fybud.health: "any"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(4200,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [fybud-net, internal]

  admin-web:
    image: fybud/cep-admin:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL:
      VITE_GOOGLE_CLIENT_ID:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    labels:
      fybud.expose: "true"
      fybud.domain: admin.cep.fybud.com
      fybud.role: web
      fybud.health: "any"
    depends_on: [admin-api]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
