# CEP-Admin — demo only (image-only). Never deploy admin to client tenants.
# Domains: cep-admin.fybud.com / api.cep-admin.fybud.com
# Shared Postgres: role/DB cep-admin-demo (password random, set by Deploy).

name: cep-admin-demo

services:
  admin-api:
    image: fiberai/cep-admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL required}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4200}:4200"
    networks: [fiberai-net]

  admin-web:
    image: fiberai/cep-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:?ADMIN_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4201}:5173"
    depends_on: [admin-api]
    networks: [fiberai-net]

networks:
  fiberai-net:
    external: true
