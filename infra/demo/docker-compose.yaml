# CEP-Admin — demo only. Shared Postgres: fybud-postgres on fybud-net (root docker-compose.db.yml).

name: cep-admin-demo

services:
  admin-api:
    image: fybud/cep-admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL required}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4200}:4200"
    networks: [fybud-net]

  admin-web:
    image: fybud/cep-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:?ADMIN_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4201}:5173"
    depends_on: [admin-api]
    networks: [fybud-net]

networks:
  fybud-net:
    name: fybud-net
    external: true
