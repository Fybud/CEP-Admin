# CEP-Admin — public admin UI + API. Host ports injected by Fybud Deploy.
name: cep-admin

services:
  admin-api:
    image: fybud/cep-admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL required}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4200"
    labels:
      fybud.expose: "true"
      fybud.domain: api.cep-admin.fybud.com
    networks: [fybud-net]

  admin-web:
    image: fybud/cep-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:?ADMIN_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    labels:
      fybud.expose: "true"
      fybud.domain: cep-admin.fybud.com
    depends_on: [admin-api]
    networks: [fybud-net]

networks:
  fybud-net:
    name: fybud-net
    external: true
