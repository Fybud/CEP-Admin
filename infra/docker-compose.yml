# CEP-Admin — public admin UI + API. Host ports injected by Fybud Deploy.
name: cep-admin

services:
  admin-api:
    image: fybud/cep-admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Paste in the Deploy UI (Settings → Tool specs → requiredEnv): empty value = "needs pasting".
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      # Also read by admin-api (the image ships dev fallbacks — paste the real values in production).
      JWT_SECRET:
      SUPER_ADMIN_EMAIL:
      # Deploy-injected — never pasted.
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL required}
      ADMIN_API_BASE_URL: ${ADMIN_API_BASE_URL:?ADMIN_API_BASE_URL required}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4200"
    labels:
      fybud.expose: "true"
      fybud.domain: api.cep-admin.fybud.com
      fybud.role: api
      # admin-api exposes no health route and auth-guards every path — process-up probe.
      fybud.health: "any"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(4200,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [fybud-net, internal]

  admin-web:
    image: fybud/cep-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:?ADMIN_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    labels:
      fybud.expose: "true"
      fybud.domain: cep-admin.fybud.com
      fybud.role: web
      fybud.health: "/"
    depends_on: [admin-api]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
